{% extends "base.html" %}
{% block title %}Редагування оцінки{% endblock %}
{% block content %}
<h1>Редагування оцінки</h1>

{% if error %}
<section>
  <p>{{ error }}</p>
</section>
{% endif %}

<section>
  <h2>Форма редагування</h2>
  <form method="post" action="{{ url_for('edit_grade', grade_id=grade.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <p>
      <label for="student_id">Студент:</label><br>
      <select id="student_id" name="student_id" required>
        <option value="">— оберіть студента —</option>
        {% for s in students %}
        <option value="{{ s.id }}" {% if form['student_id'] == s.id|string %}selected{% endif %}>
          {{ s.name }}
        </option>
        {% endfor %}
      </select>
    </p>

    <p>
      <label for="course_id">Дисципліна:</label><br>
      <select id="course_id" name="course_id" required>
        <option value="">— оберіть дисципліну —</option>
        {% for c in courses %}
        <option value="{{ c.id }}" data-semester="{{ c.semester }}"
                {% if form['course_id'] == c.id|string %}selected{% endif %}>
          {{ c.title }} ({{ c.semester }} семестр)
        </option>
        {% endfor %}
      </select>
    </p>

    <p>
      Семестр: <span id="semester">{{ grade.semester }}</span>
    </p>

    <p>
      <label for="value">Оцінка (0–100):</label><br>
      <input id="value" name="value" type="number" min="0" max="100" step="1"
             required value="{{ form['value'] }}">
    </p>

    <button type="submit">Зберегти</button>
    <a href="{{ url_for('all_grades') }}">Скасувати</a>
  </form>
</section>

<script>
  const courseSelect = document.getElementById("course_id");
  const semesterOutput = document.getElementById("semester");

  function updateSemester() {
    const option = courseSelect.selectedOptions[0];
    semesterOutput.textContent = option && option.dataset.semester
      ? option.dataset.semester
      : "—";
  }

  courseSelect.addEventListener("change", updateSemester);
  updateSemester();
</script>
{% endblock %}
