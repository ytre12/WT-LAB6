services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:5001
      - --workers
      - "1"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - app:app
    environment:
      DATA_DIR: /app/data
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    volumes:
      - ./data:/app/data
    expose:
      - "5001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - web

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    driver: bridge
